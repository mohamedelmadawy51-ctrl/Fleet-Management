@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1221; --surface:#101b31; --surface-2:#14233f; --ink:#e7eefb; --ink-2:#a8b8d4; --ink-3:#7386a8; --line:#22355a; --line-2:#1a2b4a;
    --brand:#3f7fe6; --brand-text:#7fb0ff; --brand-soft:#15294d; --leaf-text:#8fd05a;
    --side-a:#0a2a5e; --side-b:#061735;
    --ok:#3fc27a; --warn:#eab52e; --info:#5aa2ff; --bad:#ff6b66; --orange:#ff9340; --dark:#9aa6b8; --muted:#8c9bb5; --purple:#a98bff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1221; --surface:#101b31; --surface-2:#14233f; --ink:#e7eefb; --ink-2:#a8b8d4; --ink-3:#7386a8; --line:#22355a; --line-2:#1a2b4a;
  --brand:#3f7fe6; --brand-text:#7fb0ff; --brand-soft:#15294d; --leaf-text:#8fd05a;
  --side-a:#0a2a5e; --side-b:#061735;
  --ok:#3fc27a; --warn:#eab52e; --info:#5aa2ff; --bad:#ff6b66; --orange:#ff9340; --dark:#9aa6b8; --muted:#8c9bb5; --purple:#a98bff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--brand-text);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.hide{display:none!important}
.muted{color:var(--ink-3)}.sm{font-size:12px}.b{font-weight:600}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.right{margin-inline-start:auto}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side-a),var(--side-b));color:#dbe6fb;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.01em}.brand span{font-size:11.5px;color:#9fb6de}
.nav{padding:10px 10px 18px;flex:1}
.nav h6{margin:16px 10px 6px;font-size:11px;font-weight:600;color:#84a0d3;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#d5e2fa;font-size:13.5px;text-decoration:none;position:relative}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--leaf)}
.nav a .cnt{margin-inline-start:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:0 7px;font-size:11px;min-width:20px;text-align:center}
.nav a .cnt.hot{background:var(--bad);color:#fff}
.nav svg,.ico{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{padding:12px 16px;font-size:11px;color:#8ba6d8;border-top:1px solid rgba(255,255,255,.09)}
.main-wrap{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 22px}
.top h1{font-size:17px}
.gsearch{position:relative;flex:1;max-width:420px;margin-inline-start:14px}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink)}
.gsearch .ico{position:absolute;left:11px;top:9px;color:var(--ink-3)}
.gresults{position:absolute;top:40px;inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.gresults a{display:flex;gap:10px;padding:9px 12px;color:var(--ink);border-bottom:1px solid var(--line-2);text-decoration:none;align-items:center}
.gresults a:hover{background:var(--surface-2)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;position:relative;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--bad);color:#fff;font-size:10px;border-radius:12px;padding:0 5px;min-width:17px;height:17px;line-height:17px;text-align:center}
.userbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:3px 12px 3px 4px;cursor:pointer}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.menu{position:absolute;top:44px;inset-inline-end:0;min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:50;overflow:hidden}
.menu .mi{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.menu .mi:hover{background:var(--surface-2)}
.menu .mh{padding:9px 12px;font-size:12px;color:var(--ink-3);background:var(--surface-2)}
.view{padding:20px 22px 28px;flex:1;min-width:0}
.foot{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12px;flex-wrap:wrap}
.foot .chip{background:#fff;border-radius:8px;padding:3px 8px;border:1px solid var(--line);display:flex}.foot img{height:22px;display:block}
.burger{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:var(--side-w);transform:translateX(-102%);transition:transform .2s}
  body.nav-open .side{transform:none}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .burger{display:grid}.top{padding:10px 14px}.view{padding:14px}.gsearch{display:none}
}

/* ===== page pieces ===== */
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h2{font-size:21px}.ph p{margin:2px 0 0;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>.ch{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.card>.ch h3{font-size:14px}
.card>.cb{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:var(--shadow);text-align:start}
.kpi:hover{border-color:var(--brand)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;color:var(--ink)}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.spectrum{display:flex;height:16px;border-radius:9px;overflow:hidden;background:var(--line-2);gap:2px}
.spectrum i{display:block;min-width:4px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px}
.legend span{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hero{padding:16px 18px}
.hero .top-row{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.hero .big{font-size:34px;font-weight:720;letter-spacing:-.03em}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.in,select.in,textarea.in{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;min-height:34px}
textarea.in{min-height:76px;resize:vertical}
.in:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
.in[readonly]{background:var(--surface-2);color:var(--ink-2)}
label.fl{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;font-weight:550}
label.fl .req{color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.fgrid .c3{grid-column:span 3}.fgrid .c4{grid-column:span 4}.fgrid .c6{grid-column:span 6}.fgrid .c8{grid-column:span 8}.fgrid .c12{grid-column:span 12}
@media (max-width:720px){.fgrid .c3,.fgrid .c4,.fgrid .c6,.fgrid .c8{grid-column:span 12}}
.sw{display:flex;align-items:center;gap:8px;min-height:34px}
.sw input{width:18px;height:18px;accent-color:var(--brand)}
.err{color:var(--bad);font-size:12.5px;margin-top:4px}
.errbox{background:color-mix(in srgb,var(--bad) 10%,transparent);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);color:var(--ink);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.errbox li{margin:2px 0}
.okbox{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:9px;padding:10px 12px;margin-bottom:10px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.t-ok{--c:var(--ok)}.t-warn{--c:var(--warn)}.t-info{--c:var(--info)}.t-bad{--c:var(--bad)}.t-orange{--c:var(--orange)}.t-dark{--c:var(--dark)}.t-muted{--c:var(--muted)}.t-purple{--c:var(--purple)}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:12px;color:var(--ink-2)}

/* table */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.tools .in{width:auto;min-width:130px}.tools .search{min-width:220px;flex:1;max-width:340px}
.tw{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.2px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:start;font-weight:600;color:var(--ink-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;font-size:12.5px}
table.t th.ns{cursor:default}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--surface-2)}
table.t tr.od td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;color:var(--ink-3);font-size:12.5px}
.empty{padding:34px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}
.spark{display:inline-block;height:6px;border-radius:4px;background:var(--line-2);width:70px;vertical-align:middle;overflow:hidden}.spark i{display:block;height:100%;background:var(--c,var(--ok))}

/* drawer & modal */
.veil{position:fixed;inset:0;background:rgba(6,14,30,.5);z-index:60;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(1000px,100vw);background:var(--bg);z-index:61;display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.dh{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px}
.dh .ttl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dh h2{font-size:19px}
.db{overflow:auto;flex:1;padding:0 20px 24px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -20px 16px;padding:0 20px;background:var(--surface);position:sticky;top:0;z-index:2;overflow:auto}
.tabs a{padding:11px 14px;color:var(--ink-2);font-weight:550;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none;cursor:pointer}
.tabs a.on{color:var(--brand-text);border-color:var(--brand)}
.tabs a .n{background:var(--line-2);border-radius:10px;padding:0 6px;font-size:11px;margin-inline-start:5px}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;overflow:auto}
.mbox{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);border:1px solid var(--line);animation:pop .14s ease-out}
.mbox.lg{width:min(900px,100%)}.mbox.xl{width:min(1240px,100%)}
@keyframes pop{from{transform:scale(.97);opacity:.5}}
.mh2{padding:16px 20px 10px}.mh2 h3{font-size:17px}.mh2 p{margin:3px 0 0;color:var(--ink-3)}
.mb{padding:6px 20px 16px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 14px 14px}
.esign{border:1px dashed var(--brand);border-radius:10px;padding:12px;margin-top:12px;background:var(--brand-soft)}
.esign h5{margin:0 0 8px;font-size:13px;display:flex;gap:6px;align-items:center;color:var(--brand-text)}
#toasts{position:fixed;bottom:18px;inset-inline-end:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:380px;animation:pop .15s}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}

/* details */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 22px}
.kv .k{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}.kv .v{font-weight:550;word-break:break-word}.kv .w2{grid-column:1/-1}
.kv .v.long{font-weight:400;white-space:pre-wrap}
.stepper{display:flex;gap:0;margin:0 0 16px;overflow:auto;padding-bottom:4px}
.stepper .s{flex:1;min-width:104px;text-align:center;font-size:12px;color:var(--ink-3);position:relative;padding-top:24px}
.stepper .s::before{content:"";position:absolute;top:8px;inset-inline:0;height:3px;background:var(--line)}
.stepper .s::after{content:"";position:absolute;top:2px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.stepper .s.done{color:var(--ok)}.stepper .s.done::before{background:var(--ok)}.stepper .s.done::after{background:var(--ok);border-color:var(--ok)}
.stepper .s.cur{color:var(--brand-text);font-weight:650}.stepper .s.cur::after{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.stepper .s.end-ok::after{background:var(--ok);border-color:var(--ok)}.stepper .s.end-bad::after{background:var(--bad);border-color:var(--bad)}
.stepper .s.skip{opacity:.4}
.tl{position:relative;margin:0;padding:0 0 0 26px;list-style:none}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 16px}
.tl li::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c,var(--brand));border:3px solid var(--bg)}
.tl .tt{font-weight:600}.tl .tm{font-size:12px;color:var(--ink-3)}.tl .tc{margin-top:3px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:13px}
.sig{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:6px;padding:1px 7px;margin-top:4px}
.chartbox{min-height:220px}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox text{fill:var(--ink-2);font-size:11px;font-family:var(--font)}
.chartbox .gl{stroke:var(--line);stroke-width:1}
.dl{display:grid;gap:10px}
.dl .it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}.sev.high{background:var(--bad)}.sev.med{background:var(--orange)}.sev.low{background:var(--info)}
.tests-ed{overflow:auto;border:1px solid var(--line);border-radius:9px}
.tests-ed table{border-collapse:collapse;min-width:1100px;width:100%}
.tests-ed th{font-size:11.5px;text-align:start;padding:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tests-ed td{padding:4px}.tests-ed .in{min-height:30px;padding:4px 7px;font-size:12.5px}
.res-in{width:120px}.res-in.fail{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}.res-in.pass{border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:260px;display:flex;flex-direction:column}
.kcol h4{padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.kcol .cards{padding:8px;display:flex;flex-direction:column;gap:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;box-shadow:var(--shadow)}
.kc:hover{border-color:var(--brand)}
.kc .n{font-weight:650}.kc .p{font-size:12.5px;color:var(--ink-2);margin:2px 0 6px}
.mgrid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}
.mlist a{display:flex;padding:8px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;gap:8px}
.mlist a:hover{background:var(--surface-2)}.mlist a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.mlist h6{margin:12px 12px 4px;font-size:11.5px;color:var(--ink-3);font-weight:600}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}}
.matrix{overflow:auto}.matrix table{border-collapse:collapse;min-width:100%}
.matrix th,.matrix td{padding:7px 10px;border-bottom:1px solid var(--line-2);text-align:center;font-size:12.5px}
.matrix th:first-child,.matrix td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:var(--surface)}
.matrix input{width:17px;height:17px;accent-color:var(--brand)}
pre.code{background:#0b1730;color:#cfe0ff;border-radius:10px;padding:12px 14px;overflow:auto;font-size:12px;line-height:1.55}
.qrbox svg{width:100%;height:auto;display:block}


/* ===== grid engine (fleet) ===== */
.tw{overflow:auto;max-width:100%;max-height:72vh}
table.t{min-width:680px;table-layout:auto}
table.t th,table.t td{padding:10px 14px;vertical-align:top;line-height:1.45;text-align:start;min-width:88px;max-width:340px;overflow-wrap:anywhere}
table.t th{white-space:nowrap;position:sticky;top:0;z-index:1;user-select:none}
table.t td.num,table.t th.num{text-align:end}
table.t td.num{white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
table.t td.nw,table.t td .badge,table.t td .btn{white-space:nowrap}
table.t tbody tr:not([data-act]){cursor:default}
table.t th[aria-sort]{color:var(--brand-text)}
@media (max-width:640px){table.t{min-width:560px}table.t th,table.t td{padding:8px 10px}}

/* ===== M.ELMADAWY (designer) logo: circular, 3D, bottom-centre ===== */
#mlogo{position:fixed;left:50%;margin-left:-34px;bottom:12px;width:68px;height:68px;z-index:45;perspective:400px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mlg .orb{position:relative;width:100%;height:100%;padding:4px;border-radius:50%;box-sizing:border-box;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);animation:orbfloat 6s ease-in-out infinite;background:conic-gradient(from 210deg,#fff3d6,#f59e0b 18%,#7c4a03 40%,#f8d98a 62%,#b45309 82%,#fff3d6);box-shadow:0 14px 22px -6px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.8),inset 0 -3px 5px rgba(0,0,0,.35)}
.mlg .face{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;box-shadow:inset 0 6px 10px rgba(0,0,0,.28),inset 0 -5px 9px rgba(255,255,255,.9),inset 0 0 0 1px rgba(0,0,0,.12)}
.mlg .face img{width:100%;height:100%;display:block;object-fit:cover}
.mlg .face::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.85) 0,rgba(255,255,255,.35) 22%,rgba(255,255,255,0) 46%),radial-gradient(circle at 70% 88%,rgba(0,0,0,.2),rgba(0,0,0,0) 55%)}
.mlg .gnd{position:absolute;left:12%;right:12%;bottom:-8px;height:8px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);filter:blur(2px)}
.mlg:hover .orb{animation-play-state:paused;transform:rotateX(12deg) rotateY(-18deg) scale(1.1)}
@keyframes orbfloat{0%,100%{transform:rotateY(-10deg) rotateX(4deg) translateY(0)}50%{transform:rotateY(10deg) rotateX(-3deg) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.mlg .orb{animation:none}}
@media print{#mlogo{display:none}}
main.view{padding-bottom:90px}

/* ===== Production program fonts: Inter (text), Space Grotesk (titles), JetBrains Mono (numbers & codes) ===== */
h1,h2,h3,.brand b,.ph h2,.dh h2,.mh2 h3,.ch h3{font-family:var(--font-display)}
.mono,td.num,.kpi .v{font-family:var(--font-mono)}

/* ===== MOBILE LAYER (phones & small tablets only - desktop is untouched) ===== */
.bnav,.ms-bg,.ms,.mob-logo{display:none}
@media (max-width:980px){
 .side{display:none!important}
 .bnav{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:40;gap:2px;background:color-mix(in srgb,var(--surface) 95%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 22px -14px rgba(0,0,0,.45)}
 .bnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:14px;color:var(--ink-3);font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s}

 .foot{display:none}

 .toast{max-width:none}

 .ms{display:block;position:fixed;inset-inline:0;bottom:0;z-index:65;max-height:86vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -16px rgba(0,0,0,.55);animation:sheetup .22s ease-out}
 .ms-grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:6px auto 10px}
 .ms-head{display:flex;align-items:center;gap:12px;padding:4px 0 8px}
 .mob-logo{border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 2px 6px -2px rgba(0,0,0,.35)}
 .bn-logo{flex:0 0 70px;position:relative;perspective:300px}
 .bn-logo .orb{position:absolute;left:50%;top:-28px;margin-left:-30px;width:60px;height:60px;padding:4px;box-shadow:0 0 0 5px color-mix(in srgb,var(--surface) 95%,transparent),0 10px 16px -6px rgba(0,0,0,.55),inset 0 2px 3px rgba(255,255,255,.8),inset 0 -3px 5px rgba(0,0,0,.35)}
 #mlogo{display:none}
 .ms-head .mob-logo{display:block;width:44px;height:44px}
 .ms h6{margin:14px 2px 8px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
 .ms-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .ms-i{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);font-size:12px;font-weight:600;text-align:center;text-decoration:none;min-height:74px;justify-content:center;-webkit-tap-highlight-color:transparent}
 .ms-i .ico{width:24px;height:24px;color:var(--brand-text)}
 .ms-i.on{background:var(--brand-soft);border-color:var(--brand)}
 .ms-i:active{transform:scale(.97)}
 .ms-acts{display:flex;flex-wrap:wrap;gap:8px}.ms-acts .btn{flex:1 1 44%;min-height:44px;justify-content:center}
 @keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
 @keyframes fadein{from{opacity:0}to{opacity:1}}
}
@media (max-width:720px){
 .dsk{display:none!important}
 .top{flex-wrap:wrap;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
 .top .mob-logo{display:block;width:36px;height:36px}
 .top h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .top .right{display:none}
 .gsearch{display:block;order:9;width:100%;flex:1 1 100%}
 .gsearch input{width:100%}
 .view{padding:12px 12px calc(86px + env(safe-area-inset-bottom))}
 .ph{gap:8px;margin-bottom:12px}.ph h2{font-size:20px;flex:1 1 100%}
 .ph .right{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin:0}
 .ph .right .btn,.ph .right .in{flex:1 1 auto;min-height:42px}
 .btn,.iconbtn{min-height:40px}
 .in,select.in,textarea.in,input.in{font-size:16px;min-height:44px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{border-radius:14px}
 .tw{max-height:none;overflow:visible;padding:8px}
 table.t{display:block;min-width:0!important;border:0}
 table.t thead{display:none}
 table.t tbody,table.t tfoot{display:block}
 table.t tr{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:4px 12px;box-shadow:var(--shadow)}
 table.t tr[data-act]:active{background:var(--brand-soft)}
 table.t td{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0!important;border:0!important;border-bottom:1px dashed var(--line-2)!important;text-align:end;min-height:34px;white-space:normal;word-break:break-word}
 table.t td:last-child{border-bottom:0!important}
 table.t td::before{content:attr(data-label);flex:0 0 38%;max-width:45%;color:var(--ink-3);font-size:12px;font-weight:600;text-align:start}
 table.t td[data-label=""]::before{display:none}
 table.t td[data-label=""]{justify-content:flex-start}
 table.t td.num{direction:ltr}
 .tools{padding:10px}
 .tabs{margin:0 -12px 12px;padding:0 12px}
 .modal{place-items:end stretch;padding:0}
 .modal.center{place-items:center;padding:16px}
 .mbox,.mbox.lg{width:100%!important;max-height:92vh;border-radius:20px 20px 0 0;animation:sheetup .22s ease-out}
 .modal.center .mbox{border-radius:14px}
 .mb{padding:6px 16px 16px}.mh2{padding:16px 16px 8px}
 .mf{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-radius:0;gap:8px}
 .mf .btn{flex:1;min-height:46px;justify-content:center}
 .drawer{width:100vw}
 .drawer .dh .ttl{flex-wrap:wrap;gap:8px}
 .veil{z-index:60}
 .fgrid{gap:10px}
 .row{flex-wrap:wrap}
}

function loadJs(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function push(){if(ref)ref.set({json:JSON.stringify(DB),updated:firebase.database.ServerValue.TIMESTAMP}).catch(e=>toast('Cloud save failed: '+(e.code||e.message),'bad'))}
let DBREADY=false,LKN=0,LKT=0;
const sess=()=>{try{return JSON.parse(localStorage.getItem('fleet_sess'))}catch(e){return null}};
function userOk(){const x=sess();return x?DB.users.find(u=>String(u.username).toLowerCase()==String(x.u).toLowerCase()&&u.on&&u.ph&&u.ph===x.p):null}
function enter(u){window.CUR_USER=u.username;localStorage.setItem('fleet_sess',JSON.stringify({u:u.username,p:u.ph}));$('#drawerRoot2').innerHTML='';if(u.role=='admin'&&DB.imp&&!DB.imp2&&window.FLEET_SEED)importExtra(window.FLEET_SEED);render()}
function logout(){localStorage.removeItem('fleet_sess');window.CUR_USER=null;render();login()}
function chpw(){const p=prompt(lang=='ar'?'كلمة المرور الجديدة (4 أحرف على الأقل)':'New password (at least 4 characters)');if(p==null)return;if(p.length<4)return toast('Password must be at least 4 characters.','bad');const u=DB.users.find(x=>String(x.username).toLowerCase()==String(CUR_USER).toLowerCase());if(!u)return;u.salt=newSalt();u.ph=hpw(p,u.salt);persist();localStorage.setItem('fleet_sess',JSON.stringify({u:u.username,p:u.ph}));toast('Password updated','ok')}
function ready(){DBREADY=true;const u=userOk();if(u)enter(u);else if(window.CUR_USER)render();else{const b=$('#lgo');if(b){b.disabled=false;b.textContent='Sign in'}}}
function lerr(m){const b=$('#lerr');if(b){b.textContent=m;b.classList.remove('hide')}}
async function cloud(){const c=window.FIREBASE_CONFIG;if(!c||!c.apiKey)return;try{const b='https://www.gstatic.com/firebasejs/10.12.2/firebase-';await loadJs(b+'app-compat.js');await Promise.all([loadJs(b+'auth-compat.js'),loadJs(b+'database-compat.js')]);firebase.initializeApp(c);rdb=firebase.database();firebase.auth().onAuthStateChanged(u=>{if(!u){firebase.auth().signInAnonymously().catch(e=>lerr('Cannot connect: '+e.code+(e.code=='auth/admin-restricted-operation'||e.code=='auth/operation-not-allowed'?' - enable Anonymous in Firebase Authentication > Sign-in method.':'')));return}{const lr=rdb.ref('fleet/legacy');if(window.FLEET_SEED)lr.set({json:JSON.stringify(window.FLEET_SEED.legacy)}).catch(()=>{});else lr.get().then(d=>{if(d.exists()){LEG=JSON.parse(d.val().json);if(view.r=='legacy')render()}}).catch(()=>{})}const r=rdb.ref('fleet/main');let loaded=false;r.on('value',d=>{ref=r;if(!d.exists()){loaded=true;push();ready();return}const v=d.val();if(loaded&&v.json===JSON.stringify(DB))return;const first=!loaded;loaded=true;try{const raw=JSON.parse(v.json),had=(raw.users||[]).some(x=>String(x.username||x.email).toLowerCase()==ADMIN_USER);DB=fix(raw);localStorage.setItem(KEY,JSON.stringify(DB));if(!had)persist()}catch(e){}if(first)ready();else if(window.CUR_USER)render()},e=>lerr('Cloud read failed: '+(e.code||e.message)))})}catch(e){lerr('Firebase could not load. Check your internet connection and reload.')}}
function login(){$('#drawerRoot2').innerHTML=`<div class="veil" style="z-index:69"></div><div class="modal center"><div class="mbox"><div class="mh2"><h3>Sign in</h3></div><div class="mb"><div class="fgrid"><div class="c12"><label class="sm muted">Username</label><input class="in" id="em" autocomplete="username" autocapitalize="off"></div><div class="c12"><label class="sm muted">Password</label><input class="in" id="pw" type="password" autocomplete="current-password"></div></div><div class="errbox hide" id="lerr" style="margin-top:12px"></div></div><div class="mf"><button class="btn pri" id="lgo" ${DBREADY?'':'disabled'}>${DBREADY?'Sign in':'Connecting…'}</button></div></div></div>`;const go=()=>{const e=$('#lerr');e.classList.add('hide');if(!DBREADY)return;if(Date.now()<LKT)return lerr('Too many attempts. Wait a few seconds.');const n=$('#em').value.trim().toLowerCase(),p=$('#pw').value,u=DB.users.find(x=>String(x.username).toLowerCase()==n);if(!u||!u.ph||u.ph!==hpw(p,u.salt)){if(++LKN>=5){LKN=0;LKT=Date.now()+15000}return lerr('Invalid username or password.')}if(!u.on)return lerr('This account is disabled.');LKN=0;enter(u)};$('#lgo').onclick=go;$$('#em,#pw').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')go()});tr();setTimeout(()=>{const e=$('#em');e&&e.focus()},50)}

/* ---------- KPI evaluation (monthly) + driver file ---------- */
let kpiY=new Date().getFullYear(),kpiM='',ddrawer=null,dtab='Overview';
const KC=()=>DB.cfg.kpi,kcrit=()=>KC().crit.filter(c=>c.on),cn=c=>lang=='ar'&&c.ar?c.ar:c.en,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10,hasN=v=>v!==''&&v!=null&&!isNaN(+v);
const kdeliv=f=>{const t=+f.dtarget;return hasN(f.deliv)&&t>0?r1(clamp(+f.deliv/t*100,0,100)):null};
const krate=f=>hasN(f.deliv)&&hasN(f.ret)&&+f.deliv>0?r1(+f.ret/+f.deliv*100):null;
const kret=f=>{const r=krate(f);if(r==null)return null;const k=KC(),tol=+k.rtol||0,mx=Math.max(+k.rmax||0,tol+.01);return r<=tol?100:r>=mx?0:r1(100*(mx-r)/(mx-tol))};
const kval=(c,f)=>c.type=='deliv'?kdeliv(f):c.type=='ret'?kret(f):(hasN((f.sc||{})[c.id])?+f.sc[c.id]:null);
function kparts(f){const rows=kcrit().map(c=>{const v=kval(c,f),w=+c.w||0;return{c,v,w,use:v!=null&&w>0}}),sw=rows.reduce((a,x)=>a+(x.use?x.w:0),0);rows.forEach(x=>x.pts=x.use&&sw?r1(x.v*x.w/sw):null);return{rows,score:sw?r1(rows.reduce((a,x)=>a+(x.use?x.v*x.w:0),0)/sw):null}}

function custChange(t){const d=t.dataset||{};

  if(cur.en==b[1]&&(cur.ar||'')==(AR[b[1]]||''))delete DB.cfg.lbl[kk];else DB.cfg.lbl[kk]=cur;persist();render();return true}

 return false}
function custAct(c,x,y){if(!['cfadd','cfdel','cladd','cldel','flreset'].includes(c))return 0;
 if(CURR!=='admin'){toast(lang=='ar'?'للمدير فقط':'Administrators only','bad');return 1}
 if(c=='cfadd'){const en=($('#cf_en').value||'').trim(),ar=($('#cf_ar').value||'').trim(),type=$('#cf_type').value,list=$('#cf_list').value;
  if(!en)return toast('Enter the field name.','bad')||1;if(type=='L'&&!list)return toast('Choose the list for this field.','bad')||1;

 if(c=='cfdel'){const a=DB.cfg.cf[cmod]||[];if(!a[+x])return 1;if(!confirm(lang=='ar'?'حذف هذا الحقل من الشاشة؟ البيانات المسجلة تبقى محفوظة.':'Remove this field from the screen? The data already entered is kept.'))return 1;a.splice(+x,1);persist();render();return 1}

 return 1}
